<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CB Group LLC</title>
<meta name="description" content="ADVISORY · CONSULTING" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<style>
  :root {
    --ink: #0A0A0A;
    --ink-2: #1A1A1A;
    --mute: #737373;
    --bg-soft: #FAFAFA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg-soft);
    color: var(--ink);
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 40px 56px;
  }

  /* Header */
  .header,
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer { align-items: flex-end; }

  .mono {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mute);
  }

  /* Main */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 56px;
  }

  .wordmark {
    font-weight: 700;
    font-size: 220px;
    line-height: 1;
    letter-spacing: -0.035em;
    color: var(--ink);
    display: inline-flex;
    align-items: baseline;
  }
  .wordmark .grp {
    font-weight: 400;
    color: var(--mute);
    margin-left: 0.11em;
  }

  .tagline {
    max-width: 760px;
    font-weight: 500;
    font-size: 40px;
    line-height: 1.25;
    letter-spacing: 0.06em;
    color: var(--ink-2);
  }

  /* Footer */
  .contact-label { margin-bottom: 8px; }
  .email {
    color: var(--ink);
    text-decoration: none;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.5px;
  }
  .email:hover {
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .email .arrow { margin-left: 4px; }

  /* Mobile */
  @media (max-width: 768px) {
    .page { padding: 24px; }
    .wordmark { font-size: clamp(96px, 22vw, 220px); }
    .tagline  { font-size: clamp(20px, 4vw, 40px); }
    .main { gap: 32px; }
    .email { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="header">
      <span class="mono">CB Group LLC</span>
      <span class="mono"></span>
    </header>

    <main class="main">
      <div class="wordmark"><span>cb</span><span>.</span><span class="grp">group</span></div>
      <div class="tagline">ADVISORY · CONSULTING</div>
    </main>

    <footer class="footer">
      <div>
        <div class="mono contact-label">Contact</div>
        <a class="email" href="mailto:hello@cbgroup.global">hello@cbgroup.global<span class="arrow">↗</span></a>
      </div>
      <span class="mono"></span>
    </footer>
  </div>
</body>
</html>
