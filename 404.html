<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — CB Group LLC</title>
<meta name="description" content="Page not found." />
<meta name="theme-color" content="#FAFAFA" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<style>
  :root {
    --ink: #0A0A0A;
    --ink-2: #1A1A1A;
    --mute: #737373;
    --bg-soft: #FAFAFA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg-soft);
    color: var(--ink);
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .page {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 40px 56px;
  }
  .header, .footer {
    display: flex;
    justify-content: flex-start;
    align-items: center;
  }
  .footer { align-items: flex-end; }
  .mono {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 32px;
  }
  .code {
    margin: 0;
    font-weight: 700;
    font-size: 220px;
    line-height: 1;
    letter-spacing: -0.035em;
    color: var(--ink);
  }
  .msg {
    margin: 0;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.04em;
    color: var(--ink-2);
  }
  .home {
    color: var(--ink);
    text-decoration: none;
    font-size: 18px;
    font-weight: 500;
  }
  .home:hover {
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  @media (max-width: 768px) {
    .page { padding: 24px; }
    .code { font-size: clamp(96px, 22vw, 220px); }
    .msg  { font-size: clamp(18px, 4vw, 28px); }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="header">
      <span class="mono">CB Group LLC</span>
    </header>

    <main class="main">
      <h1 class="code">404</h1>
      <p class="msg">Page not found.</p>
      <a class="home" href="/">← Back to cb.group</a>
    </main>

    <footer class="footer">
      <span class="mono">cbgroup.global</span>
    </footer>
  </div>
</body>
</html>
